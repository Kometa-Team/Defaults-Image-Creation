# REVIEW TEMPLATE ONLY. Stored outside .github/workflows; not installed or enabled.
name: English Poster Canary Staging
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, stage]
        default: verify
        required: true
      release_asset_id:
        description: Separately authorized source prerelease asset ID; never an arbitrary URL
        type: string
        required: true
      confirm_staging:
        description: Requires separate exact staging authorization and environment approval
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: default-images-english-canary
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Kometa-Team/Defaults-Image-Creation' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stage_allowed: ${{ steps.policy.outputs.stage_allowed }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_ASSET_ID: ${{ inputs.release_asset_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r create_defaults/canary/requirements-staging.txt
      - name: Fetch and verify accepted archive; GET only
        run: >-
          python -m create_defaults.bulk.canary_staging fetch
          --asset-id "$CANARY_ASSET_ID" --out "$RUNNER_TEMP/canary-intake"
      - id: policy
        name: Read disabled-by-default reviewed policy
        run: |
          python - <<'PY'
          import json, os
          from create_defaults.bulk.canary_staging import envelope, SETUP
          policy = envelope(SETUP / 'staging-policy.json')
          auth = envelope(SETUP / 'staging-authorization.json')
          allowed = policy.get('staging_enabled') is True and auth.get('authorized') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('stage_allowed=' + str(allowed).lower() + '\n')
          PY
  stage:
    needs: verify
    if: >-
      needs.verify.outputs.stage_allowed == 'true' &&
      inputs.mode == 'stage' && inputs.confirm_staging == true &&
      vars.ENGLISH_CANARY_STAGING_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    # Native required reviewers are the authorization authority. Every fresh
    # dispatch pauses here; the initiator can be one of the five reviewers.
    environment: english-canary-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_ASSET_ID: ${{ inputs.release_asset_id }}
      CANARY_STAGING_CONFIRMED: ${{ inputs.confirm_staging }}
      CANARY_POLICY_VARIABLE: ${{ vars.ENGLISH_CANARY_STAGING_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r create_defaults/canary/requirements-staging.txt
      - name: Fetch exact approved archive again
        run: >-
          python -m create_defaults.bulk.canary_staging fetch
          --asset-id "$CANARY_ASSET_ID" --out "$RUNNER_TEMP/canary-intake"
      - name: Validate exact authorization and environment BEFORE minting write token
        run: >-
          python -m create_defaults.bulk.canary_staging authorize
          --bundle "$RUNNER_TEMP/canary-intake/english-canary-review-bundle.zip"
          --asset-id "$CANARY_ASSET_ID"
          --audit-root "$RUNNER_TEMP/canary-audit/preflight"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.ENGLISH_CANARY_APP_ID }}
          private-key: ${{ secrets.ENGLISH_CANARY_APP_PRIVATE_KEY }}
          owner: Kometa-Team
          repositories: Default-Images
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Create only the separately authorized seven-file draft staging PR
        env:
          CANARY_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python -m create_defaults.bulk.canary_staging stage
          --bundle "$RUNNER_TEMP/canary-intake/english-canary-review-bundle.zip"
          --asset-id "$CANARY_ASSET_ID"
          --audit-root "$RUNNER_TEMP/canary-audit/stage"
      - name: Retain immutable-at-upload audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-canary-staging-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-audit/**
          if-no-files-found: warn
          retention-days: 90
