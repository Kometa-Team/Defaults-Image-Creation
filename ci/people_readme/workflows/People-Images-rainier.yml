name: Update-Readmes
run-name: ${{ inputs.batch_id && format('README batch {0}', inputs.batch_id) || format('README {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Publisher correlation token
        required: false
        type: string
  push:

concurrency:
  group: readme-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  Update-Readmes:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip readme]') && github.event.head_commit.message != 'Readme Update') }}
    runs-on: ubuntu-latest
    steps:

      - name: Check Out Auto Readme Repo
        uses: actions/checkout@v6
        with:
          repository: Kometa-Team/People-Auto-Readme

      - name: Prepare Readme Input Tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["TARGET_REPO"]
          ref = os.environ.get("TARGET_REF", "master")

          def api(path, method="GET", payload=None):
              import http.client
              import time
              import urllib.error

              for attempt in range(4):
                  data = json.dumps(payload).encode("utf-8") if payload is not None else None
                  req = urllib.request.Request(f"https://api.github.com{path}", data=data, method=method)
                  req.add_header("Authorization", f"Bearer {token}")
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("X-GitHub-Api-Version", "2022-11-28")
                  if payload is not None:
                      req.add_header("Content-Type", "application/json")
                  delay = 2 ** attempt
                  try:
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      body = error.read(4096).lower()
                      limited = error.code == 429 or (error.code == 403 and (
                          error.headers.get("X-RateLimit-Remaining") == "0"
                          or error.headers.get("Retry-After") is not None or b"rate limit" in body))
                      if not limited and error.code not in {500, 502, 503, 504}:
                          raise
                      if limited:
                          delay = max(delay, 60)
                      try:
                          delay = max(delay, float(error.headers.get("Retry-After", "0")),
                                      float(error.headers.get("X-RateLimit-Reset", "0")) - time.time() if limited else 0)
                      except ValueError:
                          pass
                  except (urllib.error.URLError, TimeoutError, ConnectionError,
                          http.client.HTTPException, json.JSONDecodeError, UnicodeError):
                      pass
                  if attempt == 3 or delay > 300:
                      print("::error title=README_TRANSIENT_API_ERROR::GitHub API retries exhausted; rerun this job")
                      raise SystemExit("Temporary GitHub API failure; no publication success was recorded")
                  print(f"Temporary GitHub API error; retrying in {delay:.0f}s (attempt {attempt + 2}/4)")
                  time.sleep(delay)

          ref_data = api(f"/repos/{repo}/git/ref/heads/{ref}")
          head_sha = ref_data["object"]["sha"]
          commit = api(f"/repos/{repo}/git/commits/{head_sha}")
          base_tree = commit["tree"]["sha"]
          root_tree = api(f"/repos/{repo}/git/trees/{base_tree}")
          if root_tree.get("truncated"):
              raise SystemExit("GitHub root tree response was truncated; README generation cannot be trusted")

          input_root = Path("readmeinput")
          input_root.mkdir()
          readmes = {}
          image_count = 0

          for item in root_tree["tree"]:
              if item.get("type") == "blob" and item["path"] == "README.md":
                  readmes["README.md"] = item["sha"]
                  continue
              if item.get("type") != "tree":
                  continue

              prefix = item["path"]
              subtree = api(f"/repos/{repo}/git/trees/{item['sha']}?recursive=1")
              if subtree.get("truncated"):
                  raise SystemExit(f"GitHub tree response was truncated for {prefix}; README generation cannot be trusted")

              for entry in subtree["tree"]:
                  if entry.get("type") != "blob":
                      continue
                  rel = f"{prefix}/{entry['path']}"
                  lower = rel.lower()
                  if rel.endswith("README.md"):
                      readmes[rel] = entry["sha"]
                  if "/images/" not in lower:
                      continue
                  if not lower.endswith((".jpg", ".jpeg", ".png")):
                      continue
                  image_path = input_root / rel
                  image_path.parent.mkdir(parents=True, exist_ok=True)
                  image_path.touch()
                  image_count += 1

          Path("readme_manifest.json").write_text(
              json.dumps({"head_sha": head_sha, "base_tree": base_tree, "readmes": readmes}, indent=2),
              encoding="utf-8",
          )
          print(f"Prepared {image_count} image placeholder(s) from {repo}@{head_sha[:8]}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.x"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Readmes
        env:
          TARGET_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          python auto_readme.py -s "rainier" -d "readmeinput"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import quote

          # The shared generator defaults to production master links. Keep
          # indexes scoped to this repository and the branch being generated.
          base = f"https://raw.githubusercontent.com/{os.environ['TARGET_REPO']}/{quote(os.environ['TARGET_REF'], safe='/')}/"
          for path in Path("readmeinput").rglob("README.md"):
              content = path.read_text(encoding="utf-8")
              content = re.sub(r"https://raw\.githubusercontent\.com/Kometa-Team/People-Images(?:-[a-z]+)?/master/",
                               lambda _: base, content)
              path.write_text(content, encoding="utf-8")
          PY

      - name: Commit Generated Readmes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["TARGET_REPO"]
          ref = os.environ.get("TARGET_REF", "master")
          manifest = json.loads(Path("readme_manifest.json").read_text(encoding="utf-8"))

          def api(path, method="GET", payload=None):
              import http.client
              import time
              import urllib.error

              for attempt in range(4):
                  data = json.dumps(payload).encode("utf-8") if payload is not None else None
                  req = urllib.request.Request(f"https://api.github.com{path}", data=data, method=method)
                  req.add_header("Authorization", f"Bearer {token}")
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("X-GitHub-Api-Version", "2022-11-28")
                  if payload is not None:
                      req.add_header("Content-Type", "application/json")
                  delay = 2 ** attempt
                  try:
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      body = error.read(4096).lower()
                      limited = error.code == 429 or (error.code == 403 and (
                          error.headers.get("X-RateLimit-Remaining") == "0"
                          or error.headers.get("Retry-After") is not None or b"rate limit" in body))
                      if not limited and error.code not in {500, 502, 503, 504}:
                          raise
                      if limited:
                          delay = max(delay, 60)
                      try:
                          delay = max(delay, float(error.headers.get("Retry-After", "0")),
                                      float(error.headers.get("X-RateLimit-Reset", "0")) - time.time() if limited else 0)
                      except ValueError:
                          pass
                  except (urllib.error.URLError, TimeoutError, ConnectionError,
                          http.client.HTTPException, json.JSONDecodeError, UnicodeError):
                      pass
                  if attempt == 3 or delay > 300:
                      print("::error title=README_TRANSIENT_API_ERROR::GitHub API retries exhausted; rerun this job")
                      raise SystemExit("Temporary GitHub API failure; no publication success was recorded")
                  print(f"Temporary GitHub API error; retrying in {delay:.0f}s (attempt {attempt + 2}/4)")
                  time.sleep(delay)

          def blob_bytes(sha):
              blob = api(f"/repos/{repo}/git/blobs/{sha}")
              return base64.b64decode(blob["content"])

          updates = []
          existing = manifest["readmes"]
          for path in sorted(Path("readmeinput").rglob("README.md")):
              rel = path.relative_to("readmeinput").as_posix()
              new_bytes = path.read_bytes()
              old_sha = existing.get(rel)
              if old_sha and blob_bytes(old_sha) == new_bytes:
                  continue
              new_blob = api(
                  f"/repos/{repo}/git/blobs",
                  "POST",
                  {"content": base64.b64encode(new_bytes).decode("ascii"), "encoding": "base64"},
              )
              updates.append({"path": rel, "mode": "100644", "type": "blob", "sha": new_blob["sha"]})

          if not updates:
              print("No README changes")
              raise SystemExit(0)

          tree = api(f"/repos/{repo}/git/trees", "POST", {"base_tree": manifest["base_tree"], "tree": updates})
          commit = api(
              f"/repos/{repo}/git/commits",
              "POST",
              {
                  "message": "Readme Update",
                  "tree": tree["sha"],
                  "parents": [manifest["head_sha"]],
              },
          )
          try:
              api(f"/repos/{repo}/git/refs/heads/{ref}", "PATCH", {"sha": commit["sha"], "force": False})
          except urllib.error.HTTPError as err:
              if err.code in {409, 422}:
                  raise SystemExit("Remote changed while README workflow was running; a newer push should rerun this workflow")
              raise
          print(f"Updated {len(updates)} README file(s) in {repo}@{commit['sha'][:8]}")
          PY

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }}: ${{ vars.TEXT_COPYRIGHT }}"
          url: https://github.com/Kometa-Team/${{ vars.NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}



