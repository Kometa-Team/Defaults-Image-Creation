name: People recovery storage regression
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  storage:
    name: People storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing offline validation dependencies
        run: python -m pip install -r create_defaults/requirements-bulk.txt
      - name: Exercise storage, rollback, checkpoints, publication and renderer compatibility
        run: >-
          python -m pytest -q --junitxml=storage-results.xml
          create_people_posters/tests/test_people_recovery_storage.py
          create_people_posters/tests/test_people_recovery_security.py
          create_people_posters/tests/test_people_workspaces.py
          create_people_posters/tests/test_background_orchestrator.py
          create_people_posters/tests/test_remove_bg_birefnet.py
          create_people_posters/tests/test_pillow_poster.py
          create_people_posters/tests/test_people_github.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: people-storage-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: storage-results.xml
          if-no-files-found: error
          retention-days: 14
