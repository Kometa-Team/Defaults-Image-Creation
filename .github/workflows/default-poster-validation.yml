name: Default Poster Candidate Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: default-poster-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            create_defaults/requirements.txt
            create_defaults/requirements-bulk.txt
      - name: Install Python dependencies
        run: python -m pip install -r create_defaults/requirements-bulk.txt
      - name: Compile candidate and validation modules
        run: python -m compileall -q create_defaults
      - name: Unit tests and approved font hash/license checks
        run: python -m unittest discover -s create_defaults/tests -v
      - name: Verify frozen effective-job manifest and fixtures
        run: |
          python -m create_defaults.bulk.baselines --check-historical
          python create_defaults/validation_manifest.py --check create_defaults/bulk/baselines/effective-jobs-en-current.json.gz
      - name: Packages A-D infrastructure and generation tests
        run: |
          python -m unittest discover -s create_defaults/phase2/tests -v
          python -m pytest create_defaults/bulk/tests -q -rs -p no:cacheprovider
      - name: Focused offline Package D review artifacts
        run: python -m create_defaults.bulk.d_evidence smoke
      - name: Retain local-only review evidence for the team
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-d-focused-review
          retention-days: 14
          if-no-files-found: error
          path: |
            config/package-d-smoke/smoke-evidence.json
            config/package-d-smoke/layout-proposal.json
            config/package-d-smoke/cache/preview-reports/**
            config/package-d-smoke/cache/preflight/**
            config/package-d-smoke/output/**
      - name: People GitHub compatibility regressions
        run: >-
          python -m pytest
          create_people_posters/tests/test_people_github.py
          create_people_posters/tests/test_people_sandbox.py
          create_people_posters/tests/test_people_workspaces.py
          create_people_posters/tests/test_people_api_orchestrator.py
          -q -rs -p no:cacheprovider
      - name: Whitespace checks
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
