name: Portable People bulk validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docker:
    name: People bulk Docker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify additive bulk scope and unchanged historical provenance
        run: python -m unittest discover -s ci/bulk_tests -v
      - name: Build isolated test image
        run: docker build --target test -t people-bulk-tests -f create_people_posters/bulk/Dockerfile .
      - name: Run offline rendering, sync, validation and publication-safety fixtures
        run: docker run --rm --network none --cpus 4 --memory 8g --read-only --tmpfs /tmp:rw,size=4g,mode=1777 people-bulk-tests
      - name: Build production image without publishing it
        run: docker build --target release -t people-bulk -f create_people_posters/bulk/Dockerfile .
