name: Catalog Reservation Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  registry:
    name: Catalog reservations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r create_defaults/requirements-bulk.txt
      - name: Exact committed scope, bootstrap and data successor provenance
        run: python -B -m ci.phase6_playlist_maintenance
      - name: CAS writers, restart retry, collisions and publication boundaries
        run: python -B -m unittest create_defaults.phase6.tests.test_catalog_reservations create_defaults.phase6.tests.test_historical_catalog -v
      - name: Exact admission, historical receipt and fresh physical checks
        run: python -B -m unittest ci.dependency_tests.test_catalog_reservations_maintenance ci.dependency_tests.test_phase6_playlist_maintenance ci.dependency_tests.test_catalog_data_maintenance -v
      - name: Closing exact-head proof
        if: ${{ always() }}
        run: python -B -m ci.phase6_playlist_maintenance
