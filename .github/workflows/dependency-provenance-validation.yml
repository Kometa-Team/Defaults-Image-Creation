name: Dependency provenance maintenance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-provenance:
    name: Dependency provenance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install -r create_defaults/requirements-bulk.txt
    - name: Resolve retained Phase 2 requirements without changing the environment
      run: python -m pip install --dry-run --ignore-installed --only-binary=:all: -r create_defaults/phase2/requirements.txt
    - name: Resolve the People base profile without changing the environment
      run: python -m pip install --dry-run --ignore-installed --only-binary=:all: -r create_people_posters/requirements.txt
    - name: Resolve the pinned People CPU profile without changing the environment
      run: python -m pip install --dry-run --ignore-installed --only-binary=:all: -r create_people_posters/requirements-rembg.txt
    - name: Exact dependency transition and tamper controls
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        python -c "from ci.validation import identity; print(identity())"
        python -m unittest discover -s ci/dependency_tests -v
